name: augenblick

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    logging: *logging
    environment:
      POSTGRES_DB: augenblick
      POSTGRES_USER: augenblick
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a random database password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U augenblick -d augenblick"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: augenblick-backend:${RELEASE_TAG:-local}
    build:
      context: ../../
      dockerfile: platform/deploy/Dockerfile.backend
    restart: unless-stopped
    init: true
    mem_limit: 768m
    cpus: 1.0
    logging: *logging
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a random Django secret}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set explicit allowed hosts}
      DB_ENGINE: postgresql
      DB_NAME: augenblick
      DB_USER: augenblick
      DB_HOST: db
      DB_PORT: "5432"
      DB_PASSWORD: ${DB_PASSWORD:?Set a random database password}
      MEDIA_ROOT: /data/media
    volumes:
      - media:/data/media
      - type: bind
        source: ${COURSES_DIR:-./courses}
        target: /courses
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  web:
    image: augenblick-web:${RELEASE_TAG:-local}
    build:
      context: ../../
      dockerfile: platform/deploy/Dockerfile.frontend
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:80"
    volumes:
      - media:/data/media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

# Project-scoped names: augenblick_pgdata, augenblick_media, augenblick_default.
# No external networks and no published PostgreSQL/Gunicorn ports.
volumes:
  pgdata:
  media:
