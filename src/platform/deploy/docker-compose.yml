# AUGENBLICK 部署（对齐 ADR-0006~0008：PostgreSQL 17 + Django + Nginx 单站点）
# 用法：
#   cd AUGENBLICK/src/platform/deploy
#   docker compose up -d --build
#   课程导入（首次）：docker compose exec backend python manage.py import_znawca /courses/BirdsV2
# 注意：本机无 Docker，此文件未实测；生产模式（SQLite+waitress 单进程）已在本机 e2e 12/12 验证。
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: augenblick
      POSTGRES_USER: augenblick
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U augenblick"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../../          # AUGENBLICK/src
      dockerfile: platform/deploy/Dockerfile.backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?请在 .env 设置 DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - media:/data/media
      - ${COURSES_DIR:-./courses}:/courses:ro   # 课程源目录（xlsx+media+speech），只读挂载供导入
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../../          # AUGENBLICK/src
      dockerfile: platform/deploy/Dockerfile.frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
